<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | StudentDiscountFOOD</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth.js" type="module"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <header class="auth-header">
            <h1 class="logo">Student<span>DiscountFOOD</span></h1>
            <p>Create your account to save favorites and manage your profile.</p>
        </header>
        
        <form id="register-form" class="card">
            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <button type="submit" class="btn-primary full-width">Create Account</button>
            <p class="auth-footer">Already have an account? <a href="login.html">Login here</a></p>
        </form>
        <a href="index.html" class="back-link">← Back to Restaurants</a>
    </div>
</body>
</html>
